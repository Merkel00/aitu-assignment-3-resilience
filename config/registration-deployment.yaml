apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  namespace: aitu-demo
  labels: {app: registration}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: registration}
  template:
    metadata:
      labels: {app: registration}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: registration
          image: registration-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: registration
  namespace: aitu-demo
spec:
  selector: {app: registration}
  ports:
    - {name: http, port: 80, targetPort: http}
  type: ClusterIP
